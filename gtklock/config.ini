# gtklock — Catppuccin Mocha
# Lives in ~/.config/gtklock/config.ini (symlinked from here).
# Reference: https://github.com/jovanlanik/gtklock

[main]
# Path to CSS — gtklock reads this; we symlink the style alongside the config.
style = /home/xx/.config/gtklock/style.css

# Show date / time on the lock screen
time-format = %H:%M
# Idle hide of the unlock form (0 = always shown)
idle-hide = false
# Lockscreen background colour fallback if no image
no-input-period = 100

[userinfo]
under-clock = true
round-image = true
